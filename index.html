const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const wrap=document.getElementById('wrap');
let W,H;

let camDay=TODAY_DAY, playing=false, speed=3, lastTs=null, pulse=0, zoom=1;
let scrollY=0; // recalculé après resize() pour partir pile sur aujourd'hui
const PPD=90;

function resize(){ const r=wrap.getBoundingClientRect(); W=canvas.width=r.width; H=canvas.height=r.height; }

// === GEOMETRIE ROUTE VERTICALE EN S ===
function laneH(){ return roadHW()*2.8*2; } // longueur verticale d'une semaine (x2)
function margin(){ return Math.max(35,W*0.07); } // marge haut/bas pour les virages
function roadHW(){ return Math.max(22,Math.min(70,W*0.09))*zoom*1.5; } // largeur de route (x1.5)

// Nombre de semaines visibles simultanément (verticalement)
function lanesPerScreen(){ return Math.max(3, Math.floor((H*0.82) / laneH())); }

// Décalage horizontal du lundi (TODAY_DOW=0 → jour0=dimanche → 1er lundi = jour1)
const MON_SHIFT=(1-TODAY_DOW+7)%7;

// Amplitude du serpentin en S (dépend de la largeur d'écran)
function snakeAmp(){
  const mg=margin(), hw=roadHW();
  return Math.max(hw*1.5, W/2-mg-hw);
}

// Onde triangulaire continue : -1..+1, période de 8 semaines (4 à droite, 4 à gauche)
function snakeFrac(week){
  const phase=((week%8)+8)%8;
  if(phase<=4) return -1+2*(phase/4);
  return 1-2*((phase-4)/4);
}

// === PERSPECTIVE (vue façon Waze) ===
function vpX(){ return W/2; }              // point de fuite horizontal
function vpY(){ return H*0.58; }           // point de fuite vertical (horizon bas = route en pente qui descend vers nous)
function perspD(){ return H*0.55; }        // profondeur de champ (plus petit = perspective plus marquée)
function horizonY(){ return Math.max(10,vpY()-perspD()); } // ligne d'horizon réelle : point vers lequel la route converge visuellement
function perspScale(yr){
  const D=perspD();
  const depth=H*0.65-yr; // >0 = vers l'horizon (l'avenir), <0 = vers l'avant-plan (le passé proche)
  const dd=Math.max(depth,-D*0.5);
  return D/(D+dd);
}
function project(xr,yr){
  const s=perspScale(yr);
  const vx=vpX(), vy=vpY();
  return{x:vx+(xr-vx)*s, y:vy+(yr-vy)*s, s};
}

function dayToScreen(day){
  const lh=laneH(), hwRaw=roadHW();
  const adj=day-MON_SHIFT;
  const week=Math.floor(adj/7);
  const dInWk=((adj%7)+7)%7; // 0=Lundi ... 6=Dimanche
  const frac=dInWk/7;
  const A=snakeAmp();
  const xr=W/2 + A*snakeFrac(week);
  const dir=(Math.floor(week/4)%2===0)?1:-1; // 1=segment qui part vers la droite, -1=vers la gauche
  // scrollY contrôle tout : le bas de semaine 0 est à yr=H*0.65 quand scrollY=0
  // scrollY augmente → tout monte (passé descend, futur/le bonhomme montent)
  const weekBaseY=H*0.65 - week*lh + scrollY; // yr du lundi (bas de la semaine), avant perspective
  const yr=weekBaseY - frac*lh;
  const p=project(xr,yr);
  return{x:p.x,y:p.y,lane:week,dir,hw:hwRaw*p.s,dInWk};
}

function carScreen(){
  const{x,y}=dayToScreen(camDay);
  return{x,y};
}

// Edge positions at a given day
function edgesAt(day){
  const{x,y,hw}=dayToScreen(day);
  return{left:x-hw,right:x+hw,hw,x,y};
}

// Is a screen y within visible area?
function visible(y){ return y>-60&&y<H+60; }


function isSat(d){ return((TODAY_DOW+d)%7)===6; }
function isSun(d){ return((TODAY_DOW+d)%7)===0; }
function isMonday(d){ return((TODAY_DOW+d)%7)===1; }

function shortDate(d){
  const ms=new Date('2023-01-01T00:00:00Z').getTime()+d*86400000;
  const dt=new Date(ms);
  return dt.getDate()+' '+dt.toLocaleString('fr-FR',{month:'short'})+' '+dt.getUTCFullYear();
}

// ===== DRAW FUNCTIONS =====

function draw(ts){
  if(!lastTs)lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,0.1); lastTs=ts; pulse+=dt*2.5;
  if(playing){
    scrollY+=dt*speed*laneH()/7;
    scrollY=Math.max(0,Math.min(TOTAL_DAYS/7*laneH(),scrollY));
  }
  if(playingReverse){
    camDay=Math.max(0,camDay-dt*0.2);
    scrollY=camDay/7*laneH();
    if(camDay<=0){playingReverse=false;document.getElementById("revbtn").style.background="";document.getElementById("revbtn").style.color="";}
  }
  // camDay toujours dérivé de scrollY
  camDay=Math.max(0,Math.min(TOTAL_DAYS,scrollY*7/laneH()));
  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawScenery();
  drawAllLanes();
  drawVacancesBLine();
  drawDayMarks();
  drawVacanceBands();
  drawWeekendZones();
  drawJoursFeriesBands();
  drawMultiEventBands();
  drawEventBars();
  refreshAutoMultiDay();
  drawMultiDayEvents();
  drawEventTexts();
  drawPhotos();
  drawDayDates();
  drawDayLetters();
  drawMonthLabels();
  drawWeekNumbers();
  drawTodayMark();
  drawPerson();
  drawHaze();
  drawZoomedPhoto();
  requestAnimationFrame(draw);
}

function weekX(week){ return W/2 + snakeAmp()*snakeFrac(week); }
function weekBottomY(week){ return H*0.65 - week*laneH() + scrollY; } // y du lundi de cette semaine

function strokeRoundedPath(pts,radius){
  if(pts.length<2) return;
  if(pts.length===2){ ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[1].x,pts[1].y);ctx.stroke(); return; }
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1], p1=pts[i], p2=pts[i+1];
    const d1x=p1.x-p0.x, d1y=p1.y-p0.y, len1=Math.hypot(d1x,d1y)||1;
    const d2x=p2.x-p1.x, d2y=p2.y-p1.y, len2=Math.hypot(d2x,d2y)||1;
    const r=Math.min(radius, len1/2, len2/2);
    const cx1=p1.x-d1x/len1*r, cy1=p1.y-d1y/len1*r;
    const cx2=p1.x+d2x/len2*r, cy2=p1.y+d2y/len2*r;
    ctx.lineTo(cx1,cy1);
    ctx.quadraticCurveTo(p1.x,p1.y,cx2,cy2);
  }
  ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
  ctx.stroke();
}

const MONTH_ORIGIN_MS=new Date('2023-01-01T00:00:00Z').getTime();

// === JOURS FÉRIÉS FRANÇAIS ===
function easterDateUTC(year){
  const a=year%19, b=Math.floor(year/100), c=year%100;
  const d=Math.floor(b/4), e=b%4;
  const f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4), k=c%4;
  const l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(year,month-1,day));
}
const HOLIDAY_DAYS=new Set();
for(let y=2022;y<=2028;y++){
  const easter=easterDateUTC(y);
  const plus=(n)=>{const dt=new Date(easter.getTime()); dt.setUTCDate(dt.getUTCDate()+n); return dt;};
  [
    new Date(Date.UTC(y,0,1)), plus(1), new Date(Date.UTC(y,4,1)), new Date(Date.UTC(y,4,8)),
    plus(39), plus(50), new Date(Date.UTC(y,6,14)), new Date(Date.UTC(y,7,15)),
    new Date(Date.UTC(y,10,1)), new Date(Date.UTC(y,10,11)), new Date(Date.UTC(y,11,25))
  ].forEach(dt=>{
    HOLIDAY_DAYS.add(Math.round((dt.getTime()-MONTH_ORIGIN_MS)/86400000));
  });
}
function isJourFerie(day){ return HOLIDAY_DAYS.has(day); }

function dayMonthKey(day){
  const dt=new Date(MONTH_ORIGIN_MS+day*86400000);
  return dt.getUTCFullYear()*12+dt.getUTCMonth();
}
function tintForMonthKey(key){
  // Couleur pastel pseudo-aléatoire mais stable, propre à chaque mois calendaire
  let h=Math.sin(key*12.9898)*43758.5453;
  h=h-Math.floor(h);
  const hue=Math.floor(h*360);
  return `hsla(${hue},70%,55%,0.38)`;
}

function drawCloudShape(cx,cy,scale){
  const r=14*scale;
  ctx.beginPath();
  ctx.arc(cx-r*1.1,cy,r*0.8,0,Math.PI*2);
  ctx.arc(cx-r*0.3,cy-r*0.5,r,0,Math.PI*2);
  ctx.arc(cx+r*0.6,cy-r*0.2,r*0.9,0,Math.PI*2);
  ctx.arc(cx+r*1.3,cy+r*0.1,r*0.6,0,Math.PI*2);
  ctx.closePath();
  ctx.fill();
}

function drawScenery(){
  const hz=horizonY();

  // === Soleil ===
  const sunX=W*0.78, sunY=Math.max(12,hz-14);
  const sunR=Math.max(8,Math.min(18,H*0.02));
  const glow=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*2.4);
  glow.addColorStop(0,'rgba(255,241,180,0.9)');
  glow.addColorStop(0.5,'rgba(255,224,130,0.35)');
  glow.addColorStop(1,'rgba(255,224,130,0)');
  ctx.fillStyle=glow;
  ctx.beginPath();ctx.arc(sunX,sunY,sunR*2.4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffe9a8';
  ctx.beginPath();ctx.arc(sunX,sunY,sunR,0,Math.PI*2);ctx.fill();

  // === Montagnes (trois rangées marron, silhouettes détaillées à l'horizon) ===
  const baseY=hz+6;

  // Rangée lointaine (plus claire)
  ctx.fillStyle='rgba(150,120,95,0.35)';
  ctx.beginPath();
  ctx.moveTo(0,baseY+10);
  const peaksFar=10;
  for(let i=0;i<=peaksFar;i++){
    const px=W*(i/peaksFar);
    const h=5+Math.abs(Math.sin(i*1.7+0.4))*10;
    ctx.lineTo(px,baseY-h);
  }
  ctx.lineTo(W,baseY+10);
  ctx.closePath();
  ctx.fill();

  // Rangée médiane
  ctx.fillStyle='rgba(122,90,64,0.45)';
  ctx.beginPath();
  ctx.moveTo(0,baseY+10);
  const peaks=9;
  for(let i=0;i<=peaks;i++){
    const px=W*(i/peaks);
    const h=6+Math.abs(Math.sin(i*2.3+1.1))*14;
    ctx.lineTo(px,baseY-h);
    if(i<peaks){
      const midx=W*((i+0.5)/peaks);
      const midh=3+Math.abs(Math.cos(i*3.1))*7;
      ctx.lineTo(midx,baseY-midh);
    }
  }
  ctx.lineTo(W,baseY+10);
  ctx.closePath();
  ctx.fill();

  // Rangée proche (plus foncée, plus détaillée)
  ctx.fillStyle='rgba(92,63,42,0.55)';
  ctx.beginPath();
  ctx.moveTo(0,baseY+10);
  const peaks2=13;
  for(let i=0;i<=peaks2;i++){
    const px=W*(i/peaks2);
    const h=3+Math.abs(Math.cos(i*1.9+0.6))*9;
    ctx.lineTo(px,baseY-h+2);
    if(i<peaks2){
      const midx=W*((i+0.5)/peaks2);
      const midh=1+Math.abs(Math.sin(i*4.2))*4;
      ctx.lineTo(midx,baseY-midh+2);
    }
  }
  ctx.lineTo(W,baseY+10);
  ctx.closePath();
  ctx.fill();

  // === Nuages ===
  ctx.fillStyle='rgba(255,255,255,0.8)';
  [{x:W*0.18,y:Math.max(10,hz-16),s:0.55},{x:W*0.42,y:Math.max(8,hz-22),s:0.42},{x:W*0.62,y:Math.max(10,hz-10),s:0.35}]
    .forEach(c=>drawCloudShape(c.x,c.y,c.s));
}

}

function drawAllLanes(){
  const lh=laneH(), hwRaw=roadHW();
  const camWeek=Math.floor((camDay-MON_SHIFT)/7);
  const lps=lanesPerScreen();
  const batchStart=camWeek-lps-2;
  let batchEnd=camWeek+lps+2;
  {
    // Étendre vers le futur jusqu'à ce que la route rejoigne visuellement l'horizon
    let guard=0;
    while(guard<600){
      const s=perspScale(weekBottomY(batchEnd));
      if(s<0.02) break;
      batchEnd++; guard++;
    }
  }

  for(let ln=batchStart; ln<=batchEnd; ln++){
    const xr=weekX(ln);
    const yrBottom=weekBottomY(ln);
    const yrTop=yrBottom-(6/7)*lh;

    const pBL=project(xr-hwRaw,yrBottom), pBR=project(xr+hwRaw,yrBottom);
    const pTL=project(xr-hwRaw,yrTop),    pTR=project(xr+hwRaw,yrTop);
    if(!visible(pBL.y) && !visible(pTL.y)) continue;
    const isCurrentLane=(ln===camWeek);

    // === ROUTE PRINCIPALE (trapèze en perspective) ===
    ctx.fillStyle='#d4d8de';
    ctx.beginPath();
    ctx.moveTo(pTL.x,pTL.y);ctx.lineTo(pTR.x,pTR.y);
    ctx.lineTo(pBR.x,pBR.y);ctx.lineTo(pBL.x,pBL.y);
    ctx.closePath();ctx.fill();

    const rg=ctx.createLinearGradient(pTL.x,pTL.y,pTR.x,pTR.y);
    rg.addColorStop(0,'rgba(0,0,0,0.04)');
    rg.addColorStop(0.5,'rgba(255,255,255,0.08)');
    rg.addColorStop(1,'rgba(0,0,0,0.04)');
    ctx.fillStyle=rg;
    ctx.beginPath();
    ctx.moveTo(pTL.x,pTL.y);ctx.lineTo(pTR.x,pTR.y);
    ctx.lineTo(pBR.x,pBR.y);ctx.lineTo(pBL.x,pBL.y);
    ctx.closePath();ctx.fill();

    // Teinte légère propre au mois (change exactement le 1er de chaque mois)
    {
      const firstDay=ln*7+MON_SHIFT;
      const segs=[];
      let curStart=0, curKey=dayMonthKey(firstDay);
      for(let d=1;d<7;d++){
        const k=dayMonthKey(firstDay+d);
        if(k!==curKey){ segs.push({start:curStart,end:d,key:curKey}); curStart=d; curKey=k; }
      }
      segs.push({start:curStart,end:7,key:curKey});

      segs.forEach(seg=>{
        const fracStart=seg.start/7, fracEnd=Math.min(seg.end/7,6/7);
        const yrS=yrBottom-fracStart*lh, yrE=yrBottom-fracEnd*lh;
        const sBL=project(xr-hwRaw,yrS), sBR=project(xr+hwRaw,yrS);
        const sTL=project(xr-hwRaw,yrE), sTR=project(xr+hwRaw,yrE);
        ctx.fillStyle=tintForMonthKey(seg.key);
        ctx.beginPath();
        ctx.moveTo(sTL.x,sTL.y);ctx.lineTo(sTR.x,sTR.y);
        ctx.lineTo(sBR.x,sBR.y);ctx.lineTo(sBL.x,sBL.y);
        ctx.closePath();ctx.fill();
      });
    }

    // Bordures latérales (arrondies au raccord, tracées plus bas avec le raccord)

    // Traits fins entre les jours (alignés sur les vraies frontières entre jours)
    ctx.strokeStyle='rgba(0,0,0,0.25)';
    ctx.setLineDash([]);
    for(let d=1;d<7;d++){
      const dyr=yrBottom-d*(lh/7);
      const pL=project(xr-hwRaw+2,dyr), pR=project(xr+hwRaw-2,dyr);
      ctx.lineWidth=Math.max(0.5,hwRaw*0.03*pL.s);
      ctx.beginPath();ctx.moveTo(pL.x,pL.y);ctx.lineTo(pR.x,pR.y);ctx.stroke();
    }

    if(isCurrentLane){
      ctx.fillStyle='rgba(251,191,36,0.08)';
      ctx.beginPath();
      ctx.moveTo(pTL.x,pTL.y);ctx.lineTo(pTR.x,pTR.y);
      ctx.lineTo(pBR.x,pBR.y);ctx.lineTo(pBL.x,pBL.y);
      ctx.closePath();ctx.fill();
    }

    // === SAMEDI ET DIMANCHE EN BLEU CLAIR ===
    [5,6].forEach(d=>{
      const fS=d/7, fE=Math.min((d+1)/7,6/7);
      if(fE<=fS) return;
      const yS=yrBottom-fS*lh, yE=yrBottom-fE*lh;
      const wBL=project(xr-hwRaw,yS), wBR=project(xr+hwRaw,yS);
      const wTL=project(xr-hwRaw,yE), wTR=project(xr+hwRaw,yE);
      ctx.fillStyle='#a8dced';
      ctx.beginPath();
      ctx.moveTo(wTL.x,wTL.y);ctx.lineTo(wTR.x,wTR.y);
      ctx.lineTo(wBR.x,wBR.y);ctx.lineTo(wBL.x,wBL.y);
      ctx.closePath();ctx.fill();
    });

    // === JOURS FÉRIÉS EN JAUNE ===
    const firstDayFerie=ln*7+MON_SHIFT;
    for(let d=0;d<7;d++){
      const dayIdx=firstDayFerie+d;
      if(!isJourFerie(dayIdx)) continue;
      const fS=d/7, fE=Math.min((d+1)/7,6/7);
      if(fE<=fS) continue;
      const yS=yrBottom-fS*lh, yE=yrBottom-fE*lh;
      const hBL=project(xr-hwRaw,yS), hBR=project(xr+hwRaw,yS);
      const hTL=project(xr-hwRaw,yE), hTR=project(xr+hwRaw,yE);
      ctx.fillStyle='rgba(255,224,0,0.55)';
      ctx.beginPath();
      ctx.moveTo(hTL.x,hTL.y);ctx.lineTo(hTR.x,hTR.y);
      ctx.lineTo(hBR.x,hBR.y);ctx.lineTo(hBL.x,hBL.y);
      ctx.closePath();ctx.fill();
    }

    // === RACCORD vers la semaine suivante (le S) : entre dimanche et lundi ===
    const xr2=weekX(ln+1), yr2=weekBottomY(ln+1); // == yrTop, mais recalculé pour la semaine ln+1
    const pNL=project(xr2-hwRaw,yr2), pNR=project(xr2+hwRaw,yr2);
    if(visible(pTL.y)||visible(pNL.y)){
      ctx.fillStyle='#87ceeb';
      ctx.beginPath();
      ctx.moveTo(pTL.x,pTL.y);ctx.lineTo(pNL.x,pNL.y);
      ctx.lineTo(pNR.x,pNR.y);ctx.lineTo(pTR.x,pTR.y);
      ctx.closePath();ctx.fill();

      // Bordures : semaine + raccord fusionnés en un seul tracé, angle arrondi
      ctx.strokeStyle='#5a6070'; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.setLineDash([]);
      ctx.lineWidth=Math.max(2.5,hwRaw*0.12*pBL.s);
      const rad=Math.max(4,hwRaw*0.35*pTL.s);
      strokeRoundedPath([pBL,pTL,pNL],rad);
      strokeRoundedPath([pBR,pTR,pNR],rad);
    }else{
      ctx.strokeStyle='#5a6070'; ctx.lineWidth=Math.max(2.5,hwRaw*0.12*pBL.s); ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(pTL.x,pTL.y);ctx.lineTo(pBL.x,pBL.y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(pTR.x,pTR.y);ctx.lineTo(pBR.x,pBR.y);ctx.stroke();
    }
  }
}

let AUTO_RUNS=[], AUTO_EXCLUDE=new Set();
function refreshAutoMultiDay(){
  // Détecte automatiquement, dans tout l'agenda (EVT_JF + EVT_ANNE),
  // les événements de même titre qui se répètent sur des jours consécutifs :
  // ce sont des événements multi-jours qu'on affichera avec nom au départ,
  // nom à l'arrivée, et un trait qui relie les deux.
  const groups={};
  ALL_EVENTS.forEach(ev=>{
    const key=ev.side+'\u0001'+ev.title;
    (groups[key]=groups[key]||[]).push(ev.day);
  });
  const runs=[], exclude=new Set();
  Object.keys(groups).forEach(key=>{
    const days=[...new Set(groups[key])].sort((a,b)=>a-b);
    let start=days[0], prev=days[0];
    const flush=()=>{
      if(prev>start){
        const idx=key.indexOf('\u0001');
        const side=key.slice(0,idx), title=key.slice(idx+1);
        runs.push({day1:start,day2:prev,title,side,color:side==='right'?'#001a66':'#c0392b'});
        for(let d=start; d<=prev; d++) exclude.add(side+'\u0001'+d+'\u0001'+title);
      }
    };
    for(let i=1;i<days.length;i++){
      if(days[i]===prev+1){ prev=days[i]; continue; }
      flush();
      start=days[i]; prev=days[i];
    }
    flush();
  });
  AUTO_RUNS=runs; AUTO_EXCLUDE=exclude;
}

function drawMultiDayEvents(){
  [...MULTI_EVENTS,...AUTO_RUNS].forEach(ev=>{
    const d1=Math.max(0,Math.min(TOTAL_DAYS,ev.day1));
    const d2=Math.max(0,Math.min(TOTAL_DAYS,ev.day2));
    if(d2<=d1) return;

    const pts=[];
    for(let d=d1; d<=d2; d++) pts.push(dayToScreen(d));
    if(!pts.some(p=>visible(p.y))) return;

    const color=ev.color||'#e65100';

    // Trait reliant le début et la fin (suit le tracé de la route)
    ctx.strokeStyle=color;
    ctx.lineWidth=Math.max(1.2,pts[0].hw*0.05);
    ctx.setLineDash([5,4]);
    ctx.beginPath();
    pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.stroke();
    ctx.setLineDash([]);

    function labelAt(p,align){
      if(!visible(p.y)||p.hw<10) return;
      const fs=Math.max(7,Math.min(12,p.hw*0.26));
      ctx.font=`bold ${fs}px Arial`;
      ctx.textAlign='center';
      ctx.textBaseline=align==='start'?'bottom':'top';
      const ty=align==='start'?p.y-p.hw-4:p.y+p.hw+4;
      ctx.fillStyle='rgba(255,255,255,0.75)';
      ctx.fillText(ev.title,p.x+0.6,ty+0.6);
      ctx.fillStyle=color;
      ctx.fillText(ev.title,p.x,ty);
      // petit repère
      ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,p.hw*0.06),0,Math.PI*2);ctx.fill();
    }
    labelAt(pts[0],'start');
    labelAt(pts[pts.length-1],'end');
  });
}

function drawEventTexts(){
  const lh=laneH();
  const byDay={};
  ALL_EVENTS.forEach(ev=>{
    if(AUTO_EXCLUDE.has(ev.side+'\u0001'+ev.day+'\u0001'+ev.title)) return;
    if(!(ev.day in byDay)) byDay[ev.day]=[];
    byDay[ev.day].push(ev);
  });

  const rowH=lh/7;
  Object.entries(byDay).forEach(([day,evts])=>{
    const{x,y,hw}=dayToScreen(+day);
    if(!visible(y)) return;
    if(hw<14) return;

    const fs=Math.max(7,Math.min(12,Math.min(hw*0.30,rowH*0.42)));
    const lineH=Math.max(fs*1.15,fs+2);
    const anneEvts=evts.filter(e=>e.side==='left');
    const jfEvts=evts.filter(e=>e.side==='right');

    ctx.font=`bold ${fs}px Arial`;
    const maxTextW=hw*1.85;

    const useRight=(+day>=JF_RIGHT_FROM_DAY);
    const centeredEvts=useRight?anneEvts:[...anneEvts,...jfEvts];
    const rightEvts=useRight?jfEvts:[];

    // === Événements centrés sur la route (Anne, + JF avant sept. 2025) ===
    if(centeredEvts.length){
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      let ty=y-Math.min(rowH*0.4,(centeredEvts.length*lineH)/2)+lineH*0.5;
      centeredEvts.slice(0,3).forEach(ev=>{
        const isJF=ev.side==='right';
        const baseColor=isJF?'#001a66':'#004400';
        const color=isLieVacanceGlobal(ev.title)?'#e65100':baseColor;
        let title=ev.title;
        while(ctx.measureText(title).width>maxTextW && title.length>3){
          title=title.slice(0,-2);
        }
        if(title!==ev.title) title=title.trimEnd()+'…';
        if(isJF){
          const w=ctx.measureText(title).width;
          ctx.strokeStyle='rgba(0,0,0,0.7)';
          ctx.lineWidth=1;
          ctx.setLineDash([]);
          const ly=ty+lineH*0.42;
          ctx.beginPath();ctx.moveTo(x-w/2,ly);ctx.lineTo(x+w/2,ly);ctx.stroke();
        }
        ctx.fillStyle='rgba(255,255,255,0.65)';
        ctx.fillText(title,x+0.7,ty+0.7);
        ctx.fillStyle=color;
        ctx.fillText(title,x,ty);
        ty+=lineH;
      });
    }

    // === JF : à droite de la route, à partir de sept. 2025 ===
    if(rightEvts.length){
      ctx.textAlign='left';
      ctx.textBaseline='middle';
      const jx=x+hw+6;
      const maxJfW=hw*2.4;
      let ty=y-Math.min(rowH*0.4,(rightEvts.length*lineH)/2)+lineH*0.5;
      rightEvts.slice(0,3).forEach(ev=>{
        const baseColor='#001a66';
        const color=isLieVacanceGlobal(ev.title)?'#e65100':baseColor;
        let title=ev.title;
        while(ctx.measureText(title).width>maxJfW && title.length>3){
          title=title.slice(0,-2);
        }
        if(title!==ev.title) title=title.trimEnd()+'…';
        const w=ctx.measureText(title).width;
        ctx.strokeStyle='rgba(0,0,0,0.7)';
        ctx.lineWidth=1;
        ctx.setLineDash([]);
        const ly=ty+lineH*0.42;
        ctx.beginPath();ctx.moveTo(jx,ly);ctx.lineTo(jx+w,ly);ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.65)';
        ctx.fillText(title,jx+0.7,ty+0.7);
        ctx.fillStyle=color;
        ctx.fillText(title,jx,ty);
        ty+=lineH;
      });
    }
  });
}

function drawMonthLabels(){
  // Affiche mois + année à droite de la route, au raccord entre semaines, reliés par un trait vertical
  const lh=laneH();
  const ORIGIN_MS=new Date('2023-01-01T00:00:00Z').getTime();
  const camWeek=Math.floor((camDay-MON_SHIFT)/7);
  const _vl=Math.ceil(H/lh)+3;
  const lps=lanesPerScreen();
  const batchStart=camWeek-(camWeek%lps);

  let lastMonth=-1;
  const rx=Math.max(8,margin()*0.3);
  const points=[];

  for(let ln=batchStart-_vl; ln<=batchStart+lps+_vl; ln++){
    const firstDay=ln*7+MON_SHIFT;
    if(firstDay>TOTAL_DAYS||firstDay<0) continue;

    const dt=new Date(ORIGIN_MS+firstDay*86400000);
    const month=dt.getUTCMonth();
    const year=dt.getUTCFullYear();
    if(month===lastMonth) continue;
    lastMonth=month;

    const xr1=weekX(ln), yr1=weekBottomY(ln)-(6/7)*lh;   // haut de la semaine ln (brut)
    const xr0=weekX(ln-1), yr0=weekBottomY(ln-1)-(6/7)*lh; // haut de la semaine ln-1 (brut)
    const p1=project(xr1,yr1), p0=project(xr0,yr0);
    if(!visible(p1.y)&&!visible(p0.y)) continue;

    const yMid=(p0.y+p1.y)/2;
    if(!visible(yMid)) continue;

    const mois=dt.toLocaleDateString('fr-FR',{month:'long'});
    const label=mois.charAt(0).toUpperCase()+mois.slice(1)+' '+year;
    points.push({y:yMid,label,fs:Math.max(10,Math.min(16,lh*0.28*p1.s))});
  }

  if(!points.length) return;

  // Trait vertical reliant les repères de mois entre eux
  ctx.strokeStyle='rgba(45,74,30,0.4)';
  ctx.lineWidth=1.5;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(rx,points[0].y);
  for(let i=1;i<points.length;i++) ctx.lineTo(rx,points[i].y);
  ctx.stroke();

  points.forEach(pt=>{
    ctx.font=`bold ${pt.fs}px Arial`;
    ctx.textAlign='left';
    ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.fillText(pt.label, rx+8+1, pt.y+1);
    ctx.fillStyle='#2d4a1e';
    ctx.fillText(pt.label, rx+8, pt.y);
    // petit repère sur le trait
    ctx.fillStyle='#2d4a1e';
    ctx.beginPath();ctx.arc(rx,pt.y,2,0,Math.PI*2);ctx.fill();
  });
}

function drawDayLetters(){
  // Affiche l'abréviation du jour + son numéro, à côté de la route, pour chaque jour
  const ORIGIN_MS=new Date('2023-01-01T00:00:00Z').getTime();
  const camWeek=Math.floor((camDay-MON_SHIFT)/7);
  const _vl=Math.ceil(H/laneH())+3;
  // Abréviations 2 lettres
  const LABELS=['Di','Lu','Ma','Me','Je','Ve','Sa']; // 0=Dim,1=Lun,...,6=Sam

  for(let d=Math.max(0,(camWeek-_vl)*7+MON_SHIFT);
         d<=Math.min(TOTAL_DAYS,(camWeek+_vl)*7+MON_SHIFT);d++){
    const{x,y,hw}=dayToScreen(d);
    if(!visible(y)) continue;
    if(hw<12) continue;

    const jsDay=(TODAY_DOW+d)%7; // 0=Dim,1=Lun,...,6=Sam
    const lbl=LABELS[jsDay];
    const isSat2=jsDay===6, isSun2=jsDay===0;
    const isWE=isSat2||isSun2;

    const dt2=new Date(ORIGIN_MS+d*86400000);
    const dayNum=dt2.getDate();
    const moisAbrev=dt2.toLocaleDateString('fr-FR',{month:'short'}).replace('.','').slice(0,3);
    const fs=Math.max(9,Math.min(13,hw*0.26));
    const color=isWE?'#1b5e20':'#000000';

    ctx.font=`${isWE?'bold ':' '}${fs}px Arial`;
    ctx.textAlign='left';
    ctx.textBaseline='middle';
    const tx=x-hw-6;
    const txt=lbl+' '+dayNum+' '+moisAbrev;
    ctx.textAlign='right';
    ctx.fillStyle='rgba(255,255,255,0.65)';
    ctx.fillText(txt, tx+0.7, y+0.7);
    ctx.fillStyle=color;
    ctx.fillText(txt, tx, y);
  }
}

function drawPerson(){
  const{x:cx,y:cy}=carScreen();
  const s=Math.max(20,Math.min(50,roadHW()*1.2));
  const swing=playing?Math.sin(pulse*2.2)*0.42:0;
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.setLineDash([]);

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.beginPath();ctx.ellipse(cx+s*0.04,cy+s*0.06,s*0.22,s*0.07,0,0,Math.PI*2);ctx.fill();

  // Legs
  const llx=cx-s*0.11-s*0.06*Math.sin(swing), lly=cy+s*0.55+s*0.10*Math.sin(swing);
  ctx.strokeStyle='#1a3a7a'; ctx.lineWidth=s*0.14;
  ctx.beginPath();ctx.moveTo(cx-s*0.07,cy-s*0.06);
  ctx.quadraticCurveTo(cx-s*0.12,cy+s*0.28,llx,lly);ctx.stroke();
  const rlx=cx+s*0.11+s*0.06*Math.sin(swing), rly=cy+s*0.55-s*0.10*Math.sin(swing);
  ctx.beginPath();ctx.moveTo(cx+s*0.07,cy-s*0.06);
  ctx.quadraticCurveTo(cx+s*0.12,cy+s*0.28,rlx,rly);ctx.stroke();

  // Shoes
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.ellipse(llx,lly+s*0.04,s*0.10,s*0.05,-swing*0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(rlx,rly+s*0.04,s*0.10,s*0.05,swing*0.3,0,Math.PI*2);ctx.fill();

  // Jean
  ctx.strokeStyle='#2a4a7a'; ctx.lineWidth=s*0.13;
  ctx.beginPath();ctx.moveTo(cx-s*0.09,cy+s*0.12);
  ctx.quadraticCurveTo(cx-s*0.12,cy+s*0.35,llx,lly);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+s*0.09,cy+s*0.12);
  ctx.quadraticCurveTo(cx+s*0.12,cy+s*0.35,rlx,rly);ctx.stroke();

  // Hip
  ctx.fillStyle='#2a4a7a';
  ctx.beginPath();ctx.ellipse(cx,cy+s*0.02,s*0.18,s*0.10,0,0,Math.PI*2);ctx.fill();

  // T-shirt
  ctx.fillStyle='#f0f0f0';
  ctx.beginPath();
  ctx.moveTo(cx-s*0.22,cy-s*0.08);ctx.lineTo(cx+s*0.22,cy-s*0.08);
  ctx.lineTo(cx+s*0.19,cy-s*0.62);ctx.lineTo(cx-s*0.19,cy-s*0.62);
  ctx.closePath();ctx.fill();
  // Sleeves
  [[cx-s*0.19,cx-s*0.33],[cx+s*0.19,cx+s*0.33]].forEach(([ix,ox])=>{
    ctx.fillStyle='#f0f0f0';
    ctx.beginPath();
    ctx.moveTo(ix,cy-s*0.60);ctx.lineTo(ix,cy-s*0.40);
    ctx.lineTo(ox,cy-s*0.38);ctx.lineTo(ox,cy-s*0.57);
    ctx.closePath();ctx.fill();
  });

  // Arms
  ctx.strokeStyle='#e8a882'; ctx.lineWidth=s*0.11;
  ctx.beginPath();ctx.moveTo(cx-s*0.26,cy-s*0.45);
  ctx.quadraticCurveTo(cx-s*0.34,cy-s*0.28+s*0.10*swing,cx-s*0.30+s*0.08*swing,cy-s*0.06+s*0.05*swing);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+s*0.26,cy-s*0.45);
  ctx.quadraticCurveTo(cx+s*0.34,cy-s*0.28-s*0.10*swing,cx+s*0.30-s*0.08*swing,cy-s*0.06-s*0.05*swing);ctx.stroke();
  ctx.fillStyle='#e8a882';
  ctx.beginPath();ctx.arc(cx-s*0.30+s*0.08*swing,cy-s*0.06+s*0.05*swing,s*0.065,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+s*0.30-s*0.08*swing,cy-s*0.06-s*0.05*swing,s*0.065,0,Math.PI*2);ctx.fill();

  // Neck + head
  const hcy=cy-s*0.84;
  ctx.fillStyle='#e8a882';
  ctx.beginPath();ctx.ellipse(cx,cy-s*0.63,s*0.075,s*0.065,0,0,Math.PI*2);ctx.fill();
  ctx.fillRect(cx-s*0.075,cy-s*0.68,s*0.15,s*0.08);
  ctx.beginPath();ctx.ellipse(cx,hcy,s*0.195,s*0.215,0,0,Math.PI*2);ctx.fill();
  // Ears
  ctx.fillStyle='#d4906a';
  ctx.beginPath();ctx.ellipse(cx-s*0.20,hcy+s*0.02,s*0.055,s*0.08,0.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+s*0.20,hcy+s*0.02,s*0.055,s*0.08,-0.2,0,Math.PI*2);ctx.fill();
  // Nuque
  ctx.fillStyle='#e8a882';
  ctx.beginPath();ctx.ellipse(cx,cy-s*0.66,s*0.12,s*0.08,0,0,Math.PI);ctx.fill();
  // Hair
  const hairG=ctx.createRadialGradient(cx,hcy-s*0.05,0,cx,hcy,s*0.22);
  hairG.addColorStop(0,'#5a3a20');hairG.addColorStop(1,'#2a1808');
  ctx.fillStyle=hairG;
  ctx.beginPath();ctx.arc(cx,hcy-s*0.05,s*0.18,Math.PI+0.45,-0.45);ctx.fill();

  // Pulse ring
  ctx.strokeStyle=`rgba(26,115,232,${0.15+0.07*Math.sin(pulse)})`;
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy-s*0.3,s*0.35+2*Math.sin(pulse),0,Math.PI*2);ctx.stroke();
}

function rrFill(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();c.fill();
}

// Drag: vertical = scroll weeks (road moves down = go forward in time = person goes up)
//        horizontal = scrub within current week
// Mouse handled via pointer events above
canvas.style.cursor='ns-resize';
// wheel doit être posé sur wrap : canvas a pointer-events:none donc ne reçoit jamais l'event
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const lh=laneH();
  // deltaY>0 (molette vers le bas) = avancer dans le temps, comme glisser le doigt vers le haut
  scrollY=Math.max(0,Math.min(TOTAL_DAYS/7*lh, scrollY+e.deltaY/zoom));
},{passive:false});

// Touch: same logic
let tX=null,tY=null,tCam=null;
// === SCROLL TACTILE via Pointer Events ===
let pStartY=null, pStartX=null, pCamStart=null, pScrollStart=0, pVY=0, pLastY=null, pLastT=null, pIsTouch=false, pMoved=false;
let zoomedPhoto=null;

function scrollBy(dy){ /* handled in pointermove */ }

wrap.style.touchAction='none';
wrap.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')||e.target.closest('input')) return;
  pStartY=e.clientY; pStartX=e.clientX; pCamStart=camDay; pScrollStart=scrollY;
  pLastY=e.clientY; pLastT=Date.now(); pVY=0; pMoved=false;
  pIsTouch=(e.pointerType==='touch'||e.pointerType==='pen');
  wrap.setPointerCapture(e.pointerId);
  e.preventDefault();
},{passive:false});

wrap.addEventListener('pointermove',e=>{
  if(pStartY===null) return;
  if(Math.abs(e.clientX-pStartX)>10||Math.abs(e.clientY-pStartY)>10) pMoved=true;
  if(zoomedPhoto) return; // pas de scroll pendant le zoom photo
  const now=Date.now(), dt=Math.max(1,now-pLastT);
  pVY=(e.clientY-pLastY)/dt*16;
  pLastY=e.clientY; pLastT=now;
  // scrollY direct: glisser haut=avancer, bas=reculer (inversé sur tactile)
  const dy=e.clientY-pStartY;
  const lh=laneH();
  const delta=pIsTouch ? dy : -dy;
  scrollY=Math.max(0,Math.min(TOTAL_DAYS/7*lh, pScrollStart + delta));
  e.preventDefault();
},{passive:false});

wrap.addEventListener('pointerup',e=>{
  if(pStartY===null) return;
  const wasMoved=pMoved;
  pStartY=null;
  if(!wasMoved && zoomedPhoto){
    zoomedPhoto=null;
    return;
  }
  // Momentum
  let vy=pIsTouch ? -pVY : pVY;
  function momentum(){
    if(Math.abs(vy)<0.5) return;
    scrollY=Math.max(0,Math.min(TOTAL_DAYS/7*laneH(),scrollY-vy));
    vy*=0.90;
    requestAnimationFrame(momentum);
  }
  momentum();
});
wrap.addEventListener('pointercancel',()=>{pStartY=null;});

wrap.addEventListener('click',e=>{
  if(zoomedPhoto) return; // déjà géré par pointerup pour fermer
  if(e.target.closest('button')||e.target.closest('input')) return;
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
  const cx=(e.clientX-rect.left)*scaleX, cy=(e.clientY-rect.top)*scaleY;
  const hit=PHOTOS.find(p=>p._box && cx>=p._box.x && cx<=p._box.x+p._box.w && cy>=p._box.y && cy<=p._box.y+p._box.h);
  if(hit) zoomedPhoto=hit;
});

// ===== SYNCHRONISATION GOOGLE CALENDAR =====
const APPS_SCRIPT_URL = 'https://raw.githubusercontent.com/jfesteoule/agenda-jf/main/events.json';

async function syncAllCalendars(){
  const btn = document.getElementById('syncbtn');
  btn.style.color='#fbbc04';
  btn.style.animation='spin 1s linear infinite';

  try {
    const resp = await fetch(APPS_SCRIPT_URL);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const events = await resp.json();

    const ORIGIN = new Date('2023-01-01T00:00:00Z');

    EVT_JF.length=0;
    EVT_ANNE.length=0;

    events.forEach(ev=>{
      const d = new Date(ORIGIN.getTime() + ev.day*86400000);
      const label = d.getDate() + ' ' + d.toLocaleString('fr-FR',{month:'short'});
      const item = {
        day: ev.day,
        label: label,
        title: (ev.title||'').slice(0,40),
        color: ev.side==='right' ? '#1a73e8' : '#e67c73',
        side: ev.side,
        who: ev.who
      };
      if(ev.side==='right') EVT_JF.push(item);
      else EVT_ANNE.push(item);
    });

    ALL_EVENTS.length=0;
    [...EVT_JF,...EVT_ANNE].sort((a,b)=>a.day-b.day).forEach(e=>ALL_EVENTS.push(e));

    btn.style.color='#34a853';
    btn.style.animation='';
    alert('✓ ' + events.length + ' événements synchronisés !');

  } catch(err) {
    btn.style.color='#ea4335';
    btn.style.animation='';
    alert('Erreur sync: ' + err.message);
    console.error(err);
  }
}

document.getElementById('syncbtn').addEventListener('click', window.syncAllCalendars);
